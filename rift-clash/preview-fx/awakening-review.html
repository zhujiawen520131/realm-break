<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裂界 · 觉醒特效重制</title><style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans SC",sans-serif;background:#0a1118;color:#e5edf3}*{box-sizing:border-box}body{margin:0;padding:28px;max-width:1460px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px}small,.hint{color:#91a8ba}h1{font-size:clamp(26px,4vw,42px);margin:8px 0}a{color:#a3e7cb}nav{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0}button{border:1px solid #354755;background:#14212c;color:#d8e4ec;padding:10px 16px;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#bddf9e;color:#102015;border-color:#bddf9e}.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}article{background:#101c26;border:1px solid #263949;border-radius:8px;overflow:hidden}article h2,article p{margin:16px 20px}article h2{font-size:20px}article p{min-height:44px;font-size:13px;color:#99adbc;line-height:1.7}canvas{display:block;width:100%;height:auto;background:linear-gradient(#101a27,#162c36);image-rendering:pixelated}.controls{display:flex;gap:14px;align-items:center;margin:20px 0;flex-wrap:wrap}input{accent-color:#bddf9e;min-width:230px}#status{min-height:24px;color:#d4bf83}.frames{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:12px}.frames canvas{border:1px solid #314555;border-radius:3px}.frames canvas.active{border-color:#bddf9e}footer{border-top:1px solid #263949;padding-top:18px;color:#8da6b6;font-size:13px;line-height:1.8}@media(max-width:740px){body{padding:18px}.compare{grid-template-columns:1fr}header{align-items:flex-start}header a{white-space:nowrap}article p{min-height:0}}
</style></head><body>
<header><div><small>RIFT / CLASH · AWAKENING REMAKE</small><h1>觉醒，让招式变一个样。</h1></div><a id="play" href="./?v=awakening-r3">进入游戏 ↗</a></header>
<p class="hint">选择角色，对照两阶段的像素特效。每组八帧，可暂停逐帧查看；实战中将与角色动作、弹道和场景组合演出。</p>
<nav id="heroes" aria-label="选择角色"></nav>
<div class="compare"><article><h2 id="name0"></h2><canvas id="stage0" width="720" height="540"></canvas><p id="skills0"></p><div class="frames" id="frames0"></div></article><article><h2 id="name1"></h2><canvas id="stage1" width="720" height="540"></canvas><p id="skills1"></p><div class="frames" id="frames1"></div></article></div>
<div class="controls"><button id="toggle">暂停播放</button><label>帧 <input type="range" min="0" max="7" value="0" id="frame"><output id="counter">1 / 8</output></label><button id="slow">慢速 × 0.5</button></div><p id="status" role="status">载入特效…</p>
<footer>游戏操作：H 一阶觉醒，再 H 二阶觉醒；U / W＋U / S＋U 为三种技能，P 重击，V 近身技，O 奥义。每次觉醒消耗 50 气，二阶持续 10 秒。</footer>
<script src="awakening-overdrive-rules.js?v=awakening-r3"></script><script src="assets/awakening-r3/data.js?v=awakening-r3"></script><script>
'use strict';
const names={cloud:'克劳德',lara:'劳拉',wukong:'天命人',drake:'内森',tanjiro:'炭治郎',zenitsu:'善逸',manan:'马楠',luffy:'路飞',kirito:'桐人',naruto:'鸣人'};
const $=id=>document.getElementById(id),cache=new Map(),stages=[$('stage0'),$('stage1')],thumbs=[[],[]];let selected='cloud',index=0,playing=true,speed=1,last=0;
function draw(canvas,clip,frameIndex){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);const frame=clip?.frames[frameIndex],im=cache.get(frame?.image);if(!im)return;const bounds=clip.frames.map(f=>f.bounds),x0=Math.min(...bounds.map(b=>b.x)),y0=Math.min(...bounds.map(b=>b.y)),x1=Math.max(...bounds.map(b=>b.x+b.width)),y1=Math.max(...bounds.map(b=>b.y+b.height));const scale=Math.min(canvas.width*.91/(x1-x0),canvas.height*.9/(y1-y0));const dx=(canvas.width-(x1-x0)*scale)/2-x0*scale,dy=(canvas.height-(y1-y0)*scale)/2-y0*scale,r=frame.sourceRect;ctx.imageSmoothingEnabled=false;ctx.drawImage(im,r.x,r.y,r.width,r.height,dx,dy,frame.width*scale,frame.height*scale);}
function render(){const clips=RiftAwakeningR3Data.heroes[selected].clips;['surge','domain'].forEach((kind,i)=>{draw(stages[i],clips[kind],index);thumbs[i].forEach((c,j)=>c.classList.toggle('active',j===index));});$('frame').value=index;$('counter').value=(index+1)+' / 8';}
async function select(hero){selected=hero;index=0;document.querySelectorAll('[data-hero]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.hero===hero));$('play').href='./?hero='+hero+'&v=awakening-r3';const clips=RiftAwakeningR3Data.heroes[hero].clips,modes=RiftAwakeningOverdriveRules.CATALOG[hero].modes;modes.forEach((m,i)=>{$('name'+i).textContent=(i?'二阶 / ':'一阶 / ')+m.name;$('skills'+i).textContent=m.skills.map(s=>s.name).join(' · ')+' ｜ O '+m.ultimate;});$('status').textContent='载入 '+names[hero]+' 特效…';try{await Promise.all([...new Set(Object.values(clips).flatMap(c=>c.frames.map(f=>f.image)))].map(src=>new Promise((resolve,reject)=>{if(cache.has(src))return resolve();const im=new Image();im.onload=()=>{cache.set(src,im);resolve();};im.onerror=reject;im.src=src;})));if(selected!==hero)return;['surge','domain'].forEach((kind,i)=>thumbs[i].forEach((c,j)=>draw(c,clips[kind],j)));$('status').textContent=names[hero]+' · 两阶段 / 16 帧已载入';render();}catch{$('status').textContent='资源未载入，请刷新后重试。';}}
Object.entries(names).forEach(([hero,name])=>{const b=document.createElement('button');b.textContent=name;b.dataset.hero=hero;b.setAttribute('aria-pressed','false');b.onclick=()=>select(hero);$('heroes').append(b);});
for(let i=0;i<2;i++)for(let j=0;j<8;j++){const c=document.createElement('canvas');c.width=160;c.height=130;c.title='第 '+(j+1)+' 帧';c.onclick=()=>{playing=false;index=j;$('toggle').textContent='继续播放';render();};thumbs[i].push(c);$('frames'+i).append(c);}
$('toggle').onclick=()=>{playing=!playing;$('toggle').textContent=playing?'暂停播放':'继续播放';};$('frame').oninput=e=>{playing=false;index=Number(e.target.value);$('toggle').textContent='继续播放';render();};$('slow').onclick=()=>{speed=speed===1?.5:1;$('slow').textContent=speed===1?'慢速 × 0.5':'恢复正常速度';};
function tick(time){if(playing&&time-last>110/speed){last=time;index=(index+1)%8;render();}requestAnimationFrame(tick);}select(new URLSearchParams(location.search).get('hero') in names?new URLSearchParams(location.search).get('hero'):'cloud');requestAnimationFrame(tick);
</script></body></html>
