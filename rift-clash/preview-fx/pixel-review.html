<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裂界 · 像素动作检查</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101a21;color:#e3ebdf;font:15px system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:28px}a{color:#c4ee90}h1{font-size:30px}p{color:#a6b8ba;line-height:1.8}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}select,button{background:#20333c;color:#e3ebdf;border:1px solid #47606b;border-radius:8px;padding:12px;cursor:pointer}canvas{display:block;width:100%;max-width:700px;border:1px solid #324954;background:radial-gradient(ellipse at bottom,#2f4247,#15242f);image-rendering:pixelated}#frames{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0}article{border:1px solid #324954;padding:8px;border-radius:8px}article img{width:100%;image-rendering:pixelated}article span{color:#c4ee90}#status{min-height:28px}@media(max-width:600px){#frames{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:16px}}</style>
<main><a href="./">← 返回游戏</a><h1>动漫像素 · 动作检查</h1><p>这里展示游戏当前加载的角色动作帧。可暂停、逐帧查看或镜像播放。六名角色各 14 组动作，每组 8 帧；新增击倒、倒地与起身。保留原招式速度，实战按起手、命中与收招阶段取帧。本页供你审核新增素材。善逸雷闪专用八帧可在动作菜单中单独查看。</p><nav><select id="hero" aria-label="角色"></select><select id="clip" aria-label="动作"></select><button id="play">暂停</button><button id="step">下一帧</button><button id="mirror">朝向：右</button><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="0.5">半速</option><option value="0.25">四分之一速</option></select></nav><div id="status" role="status"></div><canvas id="stage" width="700" height="380"></canvas><section id="frames"></section></main>
<script src="motion-data.js?v=pixel-eight-r1"></script><script>
'use strict';const labels={cloud:'克劳德',lara:'劳拉',wukong:'天命人',drake:'内森',tanjiro:'炭治郎',zenitsu:'善逸'},actions={idle:'待机',run:'跑动',jump:'跳跃',attack1:'普攻一段',attack2:'普攻二段',attack3:'普攻三段',launcher:'挑空',air:'空中攻击',hurt:'受击',guard:'防御',dash:'冲刺',skill:'技能',ultimate:'必杀',knockdown:'击倒 · 倒地 · 起身'};const $=id=>document.getElementById(id),ctx=$('stage').getContext('2d');let images=[],frames=[],index=0,play=true,dir=1,ticket=0,elapsed=0,last=0;
for(const [id,label]of Object.entries(labels))$('hero').add(new Option(label,id));
for(const phase of ['charge','dash','launch','moonpose']){const id='sixfold_'+phase;actions[id]={charge:'六连 · 蓄势',dash:'六连 · 横冲',launch:'六连 · 上冲',moonpose:'六连 · 收势'}[phase];RiftMotionData.heroes.zenitsu.clips[id]={frames:Array.from({length:8},(_,i)=>({image:'assets/zenitsu-eight/'+phase+'_'+String(i+1).padStart(2,'0')+'.png',anchor:[256,490],durationMs:70}))};}
function clips(){const previous=$('clip').value;$('clip').replaceChildren();for(const id of Object.keys(RiftMotionData.heroes[$('hero').value].clips))$('clip').add(new Option(actions[id]||id,id));if([...$('clip').options].some(o=>o.value===previous))$('clip').value=previous;load();}
async function load(){const current=++ticket;play=false;images=[];index=0;elapsed=0;$('status').textContent='正在载入动作帧…';const list=RiftMotionData.heroes[$('hero').value].clips[$('clip').value].frames;try{const loaded=await Promise.all(list.map(f=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=f.image;})));if(current!==ticket)return;frames=list;images=loaded;$('frames').replaceChildren(...list.map((f,i)=>{const card=document.createElement('article'),title=document.createElement('span'),img=new Image();title.textContent=String(i+1).padStart(2,'0')+' / '+f.durationMs+' ms';img.src=f.image;img.alt=labels[$('hero').value]+' '+actions[$('clip').value]+' 第'+(i+1)+'帧';card.append(title,img);card.onclick=()=>{index=i;play=false;$('play').textContent='播放';};return card;}));play=true;$('play').textContent='暂停';$ ('status').textContent=list.length+' 张实际姿态 · '+labels[$('hero').value]+' / '+actions[$('clip').value];}catch{if(current===ticket)$('status').textContent='加载失败，请重新选择动作重试。';}}
$('hero').onchange=clips;$('clip').onchange=load;$('play').onclick=()=>{play=!play;$('play').textContent=play?'暂停':'播放';};$('step').onclick=()=>{play=false;index=(index+1)%Math.max(1,images.length);$('play').textContent='播放';};$('mirror').onclick=()=>{dir*=-1;$('mirror').textContent='朝向：'+(dir>0?'右':'左');};
function tick(now){const dt=Math.min(100,now-last||0);last=now;if(play&&images.length){elapsed+=dt*Number($('speed').value);if(elapsed>=(frames[index].durationMs||100)){elapsed=0;index=(index+1)%images.length;}}ctx.clearRect(0,0,700,380);ctx.strokeStyle='#557276';ctx.beginPath();ctx.moveTo(0,335);ctx.lineTo(700,335);ctx.stroke();if(images[index]){const f=frames[index],im=images[index],scale=.55;ctx.save();ctx.imageSmoothingEnabled=false;ctx.translate(350,335);ctx.scale(dir,1);ctx.drawImage(im,-f.anchor[0]*scale,-f.anchor[1]*scale,im.width*scale,im.height*scale);ctx.restore();}requestAnimationFrame(tick);}clips();requestAnimationFrame(tick);
</script></html>
