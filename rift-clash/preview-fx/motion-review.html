<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裂界 · 动作与轨迹审核</title><style>*{box-sizing:border-box}body{margin:0;background:#10191f;color:#e9efdf;font:15px system-ui}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:30px}p{color:#a8b8b7;line-height:1.8}a{color:#f0c77a}button,select,textarea{background:#223039;border:1px solid #526168;color:#edf5ec;font:inherit;padding:10px;border-radius:5px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.stage{width:100%;aspect-ratio:1200/700;overflow:hidden;background:#0a1015;margin:20px 0}iframe{border:0;width:1200px;height:700px;transform-origin:top left}#path{width:100%;height:130px;background:#17242b;border-bottom:1px solid #42535d}textarea{width:100%;height:90px;margin-top:12px}.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.notes div{background:#1c292f;padding:16px}#status{color:#e9c77e}</style><main><a href="./?v=motion-r2">← 直接进入游戏</a><h1>先起跳，再翻转，最后落地。</h1><p>这里播放的是游戏里的实际动作、碰撞与特效。选择角色和招式，慢放检查身体姿态与刀光是否同步；下方曲线记录角色真实高度。普通角色和新增动作均保持八帧美术。</p><div class="bar"><select id="hero" aria-label="角色"><option value="tanjiro">炭治郎</option><option value="zenitsu">善逸</option><option value="cloud">克劳德</option><option value="lara">劳拉</option><option value="wukong">天命人</option><option value="drake">内森</option></select><select id="form" aria-label="炭治郎模式"><option value="water">水之呼吸</option><option value="fire">火之神神乐</option></select><select id="move" aria-label="动作"></select><button id="replay">重播</button><button id="pause">暂停</button><select id="speed" aria-label="速度"><option value="1">正常速度</option><option value="0.5" selected>半速</option><option value="0.25">四分之一速度</option></select><button id="step">前进一步</button><span id="status">加载游戏资源…</span></div><div class="stage" id="stage"><iframe id="game" title="实时动作审核" src="./?hero=tanjiro&amp;v=motion-r2"></iframe></div><canvas id="path" width="1200" height="130" aria-label="真实高度轨迹"></canvas><div class="notes"><div><b>炭治郎</b><p>水车向前腾空翻转，瀧壺先跳后下劈。火神奥义逐刀换姿态，最后上跃、前翻、落斩，接触后才出现终结图。</p></div><div><b>善逸</b><p>按参考区分一闪·极、快速一闪、空转。保留无刀鞘与已确认的大Z字六连路线；空转的空中施放是本作扩展。</p></div><div><b>其他四位角色</b><p>检查重剑和棍势的发力、枪械后坐与真实发弹时刻。可逐帧看前摇、命中和收招，减少静止持帧与错位特效。</p></div></div><div class="bar"><select id="vote"><option>未审核</option><option>通过</option><option>需要修改</option></select><button id="save">复制当前审核意见</button></div><textarea id="comment" placeholder="指出具体角色、动作与需要修改的地方"></textarea></main><script>
const $=id=>document.getElementById(id),iframe=$('game'),ctx=$('path').getContext('2d');let running=true,ready=false,ticks=0,points=[],maxRise=0,last=0,acc=0,ticket=0;
const all=[['combo','普攻连段'],['skill','U 小技能'],['launcher','挑空'],['air','空中攻击'],['jump','跳跃与落地'],['ultimate','O 奥义']];
function menu(){const hero=$('hero').value;$('form').hidden=hero!=='tanjiro';const moves=[...all];if(hero==='tanjiro')moves.push(['waterfall','W+U 瀧壺 / 升炎'],['whirlpool','S+U 漩涡 / 交错炎斩'],['heavy','P 重击'],['throw','V 投技']);if(hero==='zenitsu')moves.push(['flash','W+U 快速一闪'],['airspin','S+U 空转'],['heavy','P 重击'],['airheavy','空中 P 重击'],['throw','V 连斩投技']);$('move').replaceChildren();for(const [id,label] of moves){const o=document.createElement('option');o.value=id;o.textContent=label;$('move').append(o)}$('move').value='skill'}
function code(s){return iframe.contentWindow.eval(s)}
async function reset(){const n=++ticket;ready=false;const hero=$('hero').value,move=$('move').value,fire=$('form').value==='fire'&&hero==='tanjiro';$('status').textContent='加载动作…';while(!iframe.contentWindow.document.getElementById('game'))await new Promise(r=>setTimeout(r,80));try{code(`chooseHero('${hero}');`)}catch{setTimeout(reset,120);return}for(let i=0;i<400;i++){if(n!==ticket)return;if(code('!assetLoading&&artBootReady'))break;await new Promise(r=>setTimeout(r,50))}if(n!==ticket)return;
const doc=iframe.contentWindow.document;let style=doc.getElementById('review-style');if(!style){style=doc.createElement('style');style.id='review-style';style.textContent='main{padding:0!important;margin:0!important;max-width:none!important}main>:not(.arena){display:none!important}.arena{margin:0!important;border:0!important}.arena-top,.arena-bottom,.touch-controls{display:none!important}.viewport{width:1200px!important}body{overflow:hidden!important}';doc.head.append(style)}
code(`world.reset('training','${hero}','cloud');world.settings.shake=false;world.settings.cinematics=false;world.settings.platforms=false;world.p1.x=430;world.p2.x=${move==='throw'?480:540};world.p1.energy=100;world.p1.dir=world.p1.inputDir=1;world.p1.awakenLevel=${fire?2:0};world.p1.awakenTime=${fire?600:0};started=true;paused=true;$('overlay').classList.add('hidden');fx.reset();viewCamera={x:0,y:0,zoom:1};`);
if(move==='air'||move==='airheavy')code('world.p1.y=world.p2.y=365;world.p1.vy=world.p2.vy=-3;world.refreshSupport(world.p1);world.refreshSupport(world.p2)');
const action=move==='combo'||move==='air'?'attack':move==='launcher'?'attack':['waterfall','whirlpool','flash','airspin'].includes(move)?'skill':move==='airheavy'?'heavy':move,mods=move==='launcher'?"{up:true,down:"+(hero==='tanjiro'||hero==='zenitsu'?'false':'true')+'}':move==='waterfall'?'{up:true}':move==='whirlpool'?'{down:true}':['flash','airspin'].includes(move)?JSON.stringify({variant:move}):'{}';code(`world.action(world.p1,'${action}',1,${mods});draw()`);ticks=0;points=[];maxRise=0;ready=true}
function advance(){if(!ready)return;const combo=$('move').value==='combo';const state=code(`(()=>{const a=world.p1.attack;if(${combo}&&a?.hit&&a.t>=a.move.startup+2&&!['slash4','slash5'].includes(a.name)&&(['tanjiro','zenitsu'].includes(world.p1.hero)||a.name!=='slash3'))world.action(world.p1,'attack',1);world.step();fx.tick(world);draw();return {y:world.p1.y,x:world.p1.x,combo:world.p1.combo,frame:world.frame}})()`);ticks++;points.push(state);maxRise=Math.max(maxRise,510-state.y);$('status').textContent='最高离地 '+Math.round(maxRise)+' · '+state.combo+' HIT';ctx.clearRect(0,0,1200,130);ctx.strokeStyle='#7c9aa6';ctx.beginPath();ctx.moveTo(0,116);ctx.lineTo(1200,116);ctx.stroke();ctx.strokeStyle=$('form').value==='fire'?'#ff9d40':'#7ce0ef';ctx.lineWidth=2;ctx.beginPath();const range=Math.max(200,maxRise);points.forEach((p,i)=>{const x=i/Math.max(240,points.length)*1200,y=116-(510-p.y)/range*100;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();if(ticks>360)running=false}
function loop(now){acc+=Math.min(80,now-(last||now))*Number($('speed').value);last=now;while(acc>=1000/60){if(running)advance();acc-=1000/60}requestAnimationFrame(loop)}$('hero').onchange=()=>{menu();running=true;reset()};$('form').onchange=$('move').onchange=$('replay').onclick=()=>{running=true;$('pause').textContent='暂停';reset()};$('pause').onclick=()=>{running=!running;$('pause').textContent=running?'暂停':'播放'};$('step').onclick=()=>{running=false;advance()};$('save').onclick=async()=>{const text='裂界动作审核 / motion-r2\n'+$('hero').selectedOptions[0].textContent+' / '+$('move').selectedOptions[0].textContent+'：'+$('vote').value+'\n'+($('comment').value||'无补充意见');try{await navigator.clipboard.writeText(text);$('status').textContent='审核意见已复制'}catch{$('comment').value=text;$('comment').select()}};new ResizeObserver(()=>iframe.style.transform='scale('+($('stage').clientWidth/1200)+')').observe($('stage'));menu();iframe.onload=reset;requestAnimationFrame(loop);
</script></html>
