<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裂界 · 24 FPS 动作预览</title><style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#e6ece8;background:#0b1317}*{box-sizing:border-box}body{margin:0}main{max-width:1300px;margin:auto;padding:30px 24px 70px}a{color:#b7e986;text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #2c3a3e;padding-bottom:22px}.eyebrow{color:#98b6b0;font-size:11px;letter-spacing:.2em}h1{font-size:clamp(24px,4vw,40px);letter-spacing:-.04em;margin:8px 0}p{line-height:1.7;color:#a9bcb8;margin:8px 0}.hero-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;margin:24px 0}button,select{font:inherit;background:#17252b;color:#e7eee9;border:1px solid #33494f;border-radius:5px;padding:11px 13px;cursor:pointer}button:hover,select:hover{border-color:#b7e986}button[aria-pressed=true]{color:#caff9f;border-color:#b7e986;background:#26382a}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:15px 0}.toolbar label{font-size:13px;color:#b4c7c1}.toolbar select{margin-left:8px}.stage{position:relative;border:1px solid #30444b;border-radius:8px;overflow:hidden;background:#102129}.stage canvas{display:block;width:100%;aspect-ratio:2/1;image-rendering:pixelated}.badge{position:absolute;top:18px;left:20px;display:flex;gap:8px;font-size:11px;letter-spacing:.08em}.badge span{border:1px solid #426067;padding:6px 8px;border-radius:3px;background:#12242deb;color:#c5dfda}.timeline{display:flex;align-items:center;gap:14px;padding:16px;background:#122027}input[type=range]{flex:1;min-width:80px;accent-color:#b7e986}input[type=checkbox]{accent-color:#b7e986}#frameLabel{min-width:100px;font-variant-numeric:tabular-nums;color:#b7e986;font-size:13px}.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:14px}.cel{padding:0;overflow:hidden}.cel canvas{display:block;width:100%;aspect-ratio:1/1;image-rendering:pixelated}.cel span{display:block;padding:6px;font-size:10px;color:#a9bcb8}.cel.contact{border-color:#63844a}.cel[aria-pressed=true]{outline:1px solid #b7e986}.notes{display:flex;justify-content:space-between;gap:20px;margin-top:14px;font-size:12px}.notes p{max-width:760px}#status{color:#b7e986}.error{color:#ffb598!important}@media(max-width:800px){main{padding:20px 12px}.hero-grid{grid-template-columns:repeat(5,1fr)}.hero-grid button{padding:9px 3px;font-size:12px}.strip{grid-template-columns:repeat(6,1fr)}.badge{top:8px;left:8px}.badge span{padding:4px;font-size:9px}.notes{display:block}header>a{font-size:12px}.timeline{gap:7px;padding:10px}.toolbar{gap:8px}.toolbar label{font-size:12px}.toolbar select{padding:8px}#frameLabel{min-width:75px}}
</style></head><body><main>
<header><div><div class="eyebrow">RIFT / CLASH · MOTION STUDY</div><h1>每一招，都有发力。</h1><p>角色动作逐帧预览 · 待机、连击、重击与特殊技</p></div><a id="gameLink" href="./?hero=naruto&v=motion24-r1">进入游戏 ↗</a></header>
<nav class="hero-grid" id="heroes" aria-label="选择角色"></nav>
<div class="toolbar"><label>形态<select id="mode"><option value="0">常态</option><option value="1">一阶觉醒</option><option value="2">二阶觉醒</option></select></label><label>动作<select id="clip"></select></label><button id="flip">朝向：右 →</button><label><input id="anchors" type="checkbox"> 显示手部 / 武器落点</label><span id="status" role="status">正在载入动作…</span></div>
<div class="stage"><div class="badge"><span>24 FPS</span><span id="clipName">—</span><span id="modeLabel">常态</span></div><canvas id="stage" width="1200" height="600" aria-label="动作动画预览"></canvas><div class="timeline"><button id="play" aria-pressed="true">暂停</button><button id="prev" aria-label="上一帧">←</button><input id="scrub" type="range" min="0" max="11" value="0" aria-label="动作帧"><button id="next" aria-label="下一帧">→</button><span id="frameLabel">01 / 12</span></div></div>
<div class="strip" id="strip" aria-label="独立动作帧"></div>
<div class="notes"><p id="description"></p><p>预览按原始 24 FPS 播放；游戏根据起手、命中和收招选用对应动作段。命中停顿与暂停时，身体及附着特效同时停帧。</p></div>
</main><script src="assets/motion24/data.js?v=motion24-r1"></script><script>
'use strict';
const names={cloud:'克劳德',lara:'劳拉',wukong:'天命人',drake:'内森',tanjiro:'炭治郎',zenitsu:'善逸',manan:'马楠',luffy:'路飞',kirito:'桐人',naruto:'鸣人'},labels={idle:'待机',attack1:'普攻一段',attack2:'普攻二段',attack3:'普攻三段',attack4:'连击四段',attack5:'连击五段',launcher:'挑空',air:'空中攻击',heavy:'重击',airheavy:'空中重击',throw:'近身技',dashstrike:'突进攻击',skill1:'U · 第一技能',skill2:'W + U · 第二技能',skill3:'S + U · 第三技能',ultimate:'O · 奥义动作'};
const $=id=>document.getElementById(id),ctx=$('stage').getContext('2d'),cache=new Map(),D=window.RiftMotion24Data;let hero='naruto',clipId='skill1',direction=1,playing=true,index=0,elapsed=0,last=0,current=null,loadTicket=0,stripButtons=[];
function modePack(p,n,seen=new Set()){if(seen.has(n))return {};seen.add(n);const m=p.modes[String(n)];if(!m)return {};const base=m.inherit===undefined?{}:modePack(p,String(m.inherit),seen);return {...base,...m.clips};}
function loadImage(src){if(cache.has(src))return cache.get(src);const p=new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(Error('图片加载失败，可重新选择角色重试'));im.src=src;});cache.set(src,p);p.catch(()=>cache.delete(src));return p;}
function put(c,frame,im,x,y,scale,dir){const r=frame.sourceRect||{x:0,y:0,width:frame.width,height:frame.height};c.save();c.imageSmoothingEnabled=false;c.translate(x,y);c.scale(dir*scale,scale);c.drawImage(im,r.x,r.y,r.width,r.height,-frame.anchor[0],-frame.anchor[1],frame.width,frame.height);c.restore();}
function framePaint(){if(!current)return;const f=current.clip.frames[index],im=current.images.get(f.image);ctx.clearRect(0,0,1200,600);ctx.fillStyle='#102129';ctx.fillRect(0,0,1200,600);ctx.strokeStyle='#1b343e';ctx.lineWidth=1;for(let x=0;x<=1200;x+=50){ctx.beginPath();ctx.moveTo(x,90);ctx.lineTo(x,510);ctx.stroke();}for(let y=110;y<=510;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1200,y);ctx.stroke();}ctx.fillStyle='#162b30';ctx.fillRect(0,510,1200,90);ctx.fillStyle='#6b8b6a';ctx.fillRect(0,510,1200,2);const k=current.stageScale,x=600,y=510;put(ctx,f,im,x,y,k,direction);if($('anchors').checked){for(const [name,p]of Object.entries(f.attachments||{})){const px=x+direction*(p[0]-f.anchor[0])*k,py=y+(p[1]-f.anchor[1])*k;ctx.fillStyle=name==='palm'?'#b7ff85':'#ffcc7c';ctx.fillRect(px-3,py-3,6,6);ctx.font='12px monospace';ctx.fillText(name,px+7,py-6);}}$('frameLabel').textContent=String(index+1).padStart(2,'0')+' / '+current.clip.frames.length;$('scrub').value=index;stripButtons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));}
async function select(){const ticket=++loadTicket,p=D.heroes[hero],clips=modePack(p,$('mode').value);if(!clips[clipId])clipId=Object.keys(clips)[0];$('clip').replaceChildren(...Object.keys(clips).map(id=>{const o=document.createElement('option');o.value=id;o.textContent=labels[id]||id;return o;}));$('clip').value=clipId;$('status').className='';$('status').textContent='正在载入动作…';current=null;$('gameLink').href='./?hero='+hero+'&v=motion24-r1';for(const b of $('heroes').children)b.setAttribute('aria-pressed',String(b.dataset.hero===hero));try{const clip=clips[clipId];if(!clip)throw Error('此形态尚无预览');const paths=[...new Set(clip.frames.map(f=>f.image))],ims=await Promise.all(paths.map(loadImage));if(ticket!==loadTicket)return;const ext=clip.frames.reduce((a,f)=>{const b=Array.isArray(f.bounds)?f.bounds:[0,0,f.width,f.height];a.side=Math.max(a.side,f.anchor[0]-b[0],b[0]+b[2]-f.anchor[0]);a.up=Math.max(a.up,f.anchor[1]-b[1]);a.down=Math.max(a.down,b[1]+b[3]-f.anchor[1]);return a;},{side:1,up:1,down:1});current={p,clip,images:new Map(paths.map((s,i)=>[s,ims[i]])),stageScale:Math.min(2.3*(p.scale||1)*(clip.scale||1),520/ext.side,410/ext.up,70/ext.down),thumbScale:Math.min(80/ext.side,145/ext.up,16/ext.down)};index=0;elapsed=0;$('scrub').max=clip.frames.length-1;$('clipName').textContent=names[hero]+' / '+(labels[clipId]||clipId);$('modeLabel').textContent=$('mode').selectedOptions[0].textContent;$('status').textContent=clip.frames.length+' 张独立帧';const selectedMode=p.modes[$('mode').value],shared=selectedMode?.inherit!==undefined&&!selectedMode.clips?.[clipId];$('description').textContent=(shared?'此形态保持服装与武器，身体动作显式共用；觉醒特效在游戏内独立叠加。':'独立绘制的身体与武器姿态。')+' 每帧 '+(1000/clip.fps).toFixed(2)+' ms，完整片段 '+(clip.frames.length/clip.fps).toFixed(2)+' 秒。';stripButtons=clip.frames.map((f,i)=>{const b=document.createElement('button');b.className='cel'+(i===(clip.contactFrame??clip.events?.contact)?' contact':'');b.setAttribute('aria-label','第 '+(i+1)+' 帧');const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');g.fillStyle='#11242d';g.fillRect(0,0,180,180);put(g,f,current.images.get(f.image),90,164,current.thumbScale,1);const n=document.createElement('span');n.textContent=String(i+1).padStart(2,'0');b.append(c,n);b.onclick=()=>{pause();index=i;framePaint();};return b;});$('strip').replaceChildren(...stripButtons);framePaint();}catch(e){if(ticket===loadTicket){$('status').textContent=e.message;$('status').className='error';}}}
function pause(){playing=false;$('play').textContent='播放';$('play').setAttribute('aria-pressed','false');}
for(const [id,name]of Object.entries(names)){const b=document.createElement('button');b.textContent=name;b.dataset.hero=id;b.onclick=()=>{hero=id;select();};$('heroes').append(b);}
$('mode').onchange=select;$('clip').onchange=()=>{clipId=$('clip').value;select();};$('flip').onclick=()=>{direction*=-1;$('flip').textContent=direction===1?'朝向：右 →':'朝向：左 ←';framePaint();};$('anchors').onchange=framePaint;$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';$('play').setAttribute('aria-pressed',String(playing));elapsed=0;};$('scrub').oninput=()=>{pause();index=+$('scrub').value;framePaint();};for(const [id,delta]of [['prev',-1],['next',1]])$(id).onclick=()=>{if(!current)return;pause();index=(index+delta+current.clip.frames.length)%current.clip.frames.length;framePaint();};document.addEventListener('visibilitychange',()=>{last=0;elapsed=0;});
function tick(t){if(last&&playing&&current&&!document.hidden){elapsed+=Math.min(t-last,100);const ms=1000/current.clip.fps;if(elapsed>=ms){const advance=Math.floor(elapsed/ms);elapsed%=ms;index=(index+advance)%current.clip.frames.length;framePaint();}}last=t;requestAnimationFrame(tick);}select();requestAnimationFrame(tick);
</script></body></html>
