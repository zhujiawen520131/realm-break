<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>善逸新版 · 对照炭治郎动作</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1419;color:#edf3ef;font:16px/1.65 system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:26px 20px 60px}a{color:#c3f58b}h1{font-size:clamp(25px,4vw,38px);margin:15px 0}p{color:#a9bdc6}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 0}button,select{background:#213139;color:inherit;border:1px solid #516770;border-radius:8px;padding:10px 15px;font:inherit;cursor:pointer}button:disabled,select:disabled{opacity:.4;cursor:wait}button.active,#play{background:#c3f58b;color:#0c1419}#scrub{width:min(100%,320px);accent-color:#c3f58b}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0;background:#132127;border:1px solid #334952;border-radius:12px;padding:18px;min-width:0}figcaption{font-size:20px;font-weight:700}figure p{font-size:14px;margin:5px 0 15px}figure img{display:block;width:100%;height:480px;object-fit:contain;image-rendering:pixelated;background:#091117}#frames{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}#frames button{flex:1;min-width:115px}#position{font-variant-numeric:tabular-nums;min-width:145px}#status{border-left:3px solid #c3f58b;padding-left:12px}footer{border-top:1px solid #334952;padding-top:18px;margin-top:28px}@media(max-width:640px){.pair{grid-template-columns:1fr}figure img{height:360px}.controls{gap:8px}button{padding:9px 12px}}</style><main><a href="../?item=zenitsu-lightning">← 返回审核页提交意见</a><h1>炭治郎动作参考 × 善逸雷光新稿</h1><p>对照身体与刀路：后引、过顶举刀、下劈、横扫、转背和持刀收势。善逸保留自己的造型、雷光与无刀鞘设定。</p><p id="status" role="status">正在载入两组实际帧图…</p><div class="controls"><button id="play" disabled>▶ 播放</button><button id="prev" disabled>上一帧</button><button id="next" disabled>下一帧</button><span id="position">1 / 8</span><label>速度 <select id="speed" disabled><option value="0.25">0.25×</option><option value="0.5" selected>0.5×</option><option value="1">1×</option></select></label><input id="scrub" type="range" min="0" max="7" value="0" aria-label="同步选择帧" disabled></div><div class="pair"><figure><figcaption>炭治郎 · 已通过的参考动作</figcaption><p>原帧保持不变</p><img id="reference" alt="炭治郎参考动作"></figure><figure><figcaption>善逸 · 本次重画</figcaption><p>仅动作更新，待用户复审</p><img id="new" alt="善逸新版动作"></figure></div><div id="frames" aria-label="逐帧选择"></div><p>两组按帧序同步，播放沿用善逸的审核预览时长，便于比较姿态；不代表游戏实战速度。</p><footer><a href="../?item=zenitsu-lightning">回到善逸审核项，填写通过或修改意见 ↗</a></footer></main><script>
const data={"reference": [{"src": "../frames/tanjiro-water/01.png", "sha256": "c70aadcaaf9b49956445454c5bfe755438a73d5eaba0800d556db73e1809e068"}, {"src": "../frames/tanjiro-water/02.png", "sha256": "ac213b87b509265e93936d60da76d332e6fe9ea3bc2b74f278d4de7c41bc7af7"}, {"src": "../frames/tanjiro-water/03.png", "sha256": "8d0b4b816b254b5ec09292ad674cd2488fa4556c6c3909c6e670cda5deb2886b"}, {"src": "../frames/tanjiro-water/04.png", "sha256": "09855923656973a931e2cf40690b6f688d149933efd9e7441804018b4bae8bbe"}, {"src": "../frames/tanjiro-water/05.png", "sha256": "3b3990eb7317f593a016dc6ae176696c93621866f8191d7e32ea2582ebe10e0b"}, {"src": "../frames/tanjiro-water/06.png", "sha256": "fa78ba9ebca25f2f0750897e567617dbeb386b86ef9c0dcddd6726154d8227e8"}, {"src": "../frames/tanjiro-water/07.png", "sha256": "68e099a0aa8147ed7a69951ebfd4fe48ed72fa30c0d4cb3be52441b5e0a01bed"}, {"src": "../frames/tanjiro-water/08.png", "sha256": "d79e9a39d43da9445f1f5f8d574f1158e5179e68426e679002ba1dab2fda1757"}], "new": [{"src": "../zenitsu-r4/frames/01.png", "sha256": "04e8e6bafa2011e7e5a487dc795f07f04eb40edd89ab3ff110f39873dd92da5e", "durationMs": 120}, {"src": "../zenitsu-r4/frames/02.png", "sha256": "73c68195f3bab3503158b2102c07918c07054cdcd9c2b00492d93bd387b03bdd", "durationMs": 110}, {"src": "../zenitsu-r4/frames/03.png", "sha256": "1556c3e05bf36596db900e1d69998a80b169cc08e4e2c721b0cb64b10a2c015c", "durationMs": 130}, {"src": "../zenitsu-r4/frames/04.png", "sha256": "37ecd14bfb7f7eca9567262dd2d3f4fd2a82ad6cc78aec8d684f39864511e5d8", "durationMs": 70}, {"src": "../zenitsu-r4/frames/05.png", "sha256": "ab02ff4a618ac7a20d36c48922686879eca1f029e4415e65678d443e2923959d", "durationMs": 90}, {"src": "../zenitsu-r4/frames/06.png", "sha256": "1cf1482adcc8cef7d2b206c6290e8210a9767de27316e8052cb3fea7859e117b", "durationMs": 100}, {"src": "../zenitsu-r4/frames/07.png", "sha256": "fbd3c284402d7bfe01a21091f0afdc912339913322df1773f116a868cd1aee4d", "durationMs": 110}, {"src": "../zenitsu-r4/frames/08.png", "sha256": "a93ae64b2a8aec656487c687c58a65505e32816c1f5776bd17386bfd00375b77", "durationMs": 160}]};
const labels=['准备','后引','过顶','下劈','横扫','转背','制动','收势'];let frame=0,playing=false,timer=null;const $=id=>document.getElementById(id);
function render(){ $('reference').src=data.reference[frame].src;$('new').src=data.new[frame].src;$('position').textContent=`${frame+1} / 8 · ${labels[frame]}`;$('scrub').value=frame;for(const b of $('frames').children){b.classList.toggle('active',Number(b.dataset.index)===frame);b.setAttribute('aria-pressed',String(Number(b.dataset.index)===frame));}}
function stop(){playing=false;clearTimeout(timer);$('play').textContent='▶ 播放';}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>{if(!playing)return;frame=(frame+1)%8;render();schedule();},data.new[frame].durationMs/Number($('speed').value));}
function select(n){stop();frame=(n+8)%8;render();}
$('play').onclick=()=>{if(playing)return stop();playing=true;$('play').textContent='❚❚ 暂停';schedule();};$('prev').onclick=()=>select(frame-1);$('next').onclick=()=>select(frame+1);$('scrub').oninput=()=>select(Number($('scrub').value));$('speed').onchange=()=>{if(playing)schedule();};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
Promise.all([...data.reference,...data.new].map(a=>new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=()=>reject(new Error('部分帧图未载入，请刷新重试。'));img.src=a.src;}))).then(()=>{for(const id of ['play','prev','next','speed','scrub'])$(id).disabled=false;labels.forEach((label,i)=>{const b=document.createElement('button');b.textContent=`${i+1} ${label}`;b.dataset.index=i;b.onclick=()=>select(i);$('frames').append(b);});render();$('status').textContent='已载入 16 张实际帧图，可同步播放或逐帧对照。';}).catch(e=>{$('status').textContent=e.message;});
</script></html>
